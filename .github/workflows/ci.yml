name: ci
on:
  push:
  pull_request:

# Least privilege. The CLI scan reads only the checked-out repo — it makes NO GitHub API
# calls, so it needs no `pull-requests` scope and no GITHUB_TOKEN. (The gitleaks-action's
# `pull_request` mode lists PR commits via GET /pulls/{n}/commits, which fails here with
# "GITHUB_TOKEN is now required to scan pull requests"; the CLI sidesteps that entirely.)
permissions:
  contents: read

jobs:
  # Defense-in-depth: even a clone without the local pre-commit hook cannot land
  # a secret on a branch — CI re-scans the FULL history on every push/PR.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, not just the diff
      - name: Scan full history with gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks git . --config .gitleaks.toml --redact --exit-code 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # package-lock.json is gitignored in this repo, so `npm install` (not `npm ci`).
      - run: npm install --no-audit --no-fund
      - run: node --test
